<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>VodaSure Funeral Cover — React A/B Variant</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#202124;font-family:Arial,Helvetica,sans-serif}.shell{max-width:920px;margin:auto;min-height:100vh;background:white;box-shadow:0 0 30px #ddd}header{height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}.brand{font-weight:800;font-size:28px;color:#e60000}.brand span{color:#222}.preview{font-size:12px;background:#f1f3f4;padding:7px 10px;border-radius:999px}.progress{display:flex;padding:22px 26px;gap:8px;overflow:auto;border-bottom:1px solid #eee}.progress div{display:flex;align-items:center;gap:5px;color:#aaa;min-width:max-content}.progress div:after{content:'—';margin-left:4px;color:#ddd}.progress div:last-child:after{display:none}.progress b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#eee;font-size:11px}.progress .on{color:#e60000}.progress .on b{background:#e60000;color:#fff}main{max-width:700px;margin:auto;padding:46px 24px 70px}h1{font-size:36px;margin:0 0 8px}h2{font-size:18px;margin:24px 0 12px}.lede{color:#666;margin:0 0 28px}.card{border:1px solid #e3e3e3;border-radius:16px;padding:24px;background:#fff}.choice,.amounts,.pay{display:flex;gap:10px;flex-wrap:wrap}.choice button,.amounts button,.pay button{background:#fff;border:1px solid #bbb;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer}.selected{border-color:#e60000!important;background:#fff5f5!important;color:#c80000}.estimate{margin-top:24px;background:#f8f8f8;padding:18px;border-radius:12px;display:grid;gap:5px}.estimate strong{font-size:30px}.estimate small{color:#777}.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.footer button{border-radius:999px;padding:13px 24px;font-weight:800;cursor:pointer}.primary{background:#e60000;color:#fff;border:1px solid #e60000}.secondary{background:#fff;color:#333;border:1px solid #aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{width:100%;border:1px solid #bbb;border-radius:9px;padding:13px;font-size:15px}.quote{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.quote strong{font-size:34px;color:#e60000}.quote small{font-size:13px;color:#666}.toggle,.member{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #eee}.toggle input,.terms input{width:auto}.member span{flex:1}.member button{border:0;background:#fff;color:#e60000;font-weight:800;cursor:pointer}.summary p{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.terms{display:flex;align-items:center;gap:10px;margin-top:20px}.success{width:72px;height:72px;border-radius:50%;background:#e9f8ec;color:#16833b;display:grid;place-items:center;font-size:40px;font-weight:800;margin-bottom:20px}code{background:#f2f2f2;padding:2px 4px;border-radius:4px}@media(max-width:650px){header{padding:0 18px}.preview{display:none}.progress{padding:16px 18px}.progress small{display:none}.progress div:after{content:'·'}main{padding:32px 18px 60px}h1{font-size:29px}.grid{grid-template-columns:1fr}.choice button,.pay button{flex:1}.amounts button{flex:1 0 28%}.footer{position:sticky;bottom:0;background:white;padding:15px 0}.footer button{flex:1}}</style></head><body><div id="root"></div><script type="module">import React,{createContext,useContext,useEffect,useState} from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';
import {BrowserRouter,useLocation,useNavigate} from 'https://esm.sh/react-router-dom@6.30.2';
const AppContext=createContext(null);
const initial={personal:{firstName:'',surname:'',dateOfBirth:'',cellphoneNumber:'',email:'',idNumber:''},product:{coverAmount:20000,coverType:'individual',totalPremium:79,addOns:{dataReward:false,funeral:false}},family:{spouse:[],child:[],extended:[]},beneficiary:{firstName:'',surname:'',cellphoneNumber:''},payment:{paymentMethod:'debitOrder',bankName:'',accountNumber:'',accountHolderName:'',agreeToTerms:false}};
function Provider({children}){const [state,setState]=useState(()=>JSON.parse(sessionStorage.getItem('application-preview')||'null')||initial);useEffect(()=>sessionStorage.setItem('application-preview',JSON.stringify(state)),[state]);return <AppContext.Provider value={{state,setState}}>{children}</AppContext.Provider>}
const steps=['/funeral-cover/cover-details','/funeral-cover/quote','/funeral-cover/personal-details','/funeral-cover/family-details','/funeral-cover/beneficiary','/funeral-cover/payment','/funeral-cover/payment/debit-order','/funeral-cover/payment-summary','/funeral-cover/confirmation'];
const labels=['Cover','Quote','Details','Family','Beneficiary','Payment','Bank','Summary','Done'];
function money(v){return new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0}).format(v)}
function mockPremium(s){const base={10000:49,20000:79,30000:99,40000:119,50000:139}[s.product.coverAmount]||79;const family=s.product.coverType==='family'?s.family.spouse.length*35+s.family.child.length*12+s.family.extended.length*20:0;return base+family+(s.product.addOns.dataReward?15:0)+(s.product.addOns.funeral?20:0)}
function App(){const {state,setState}=useContext(AppContext);const nav=useNavigate(),loc=useLocation();let idx=steps.indexOf(loc.pathname);if(idx<0){idx=0;}useEffect(()=>{if(!steps.includes(loc.pathname)) nav(steps[0],{replace:true});},[]);useEffect(()=>{setState(s=>({...s,product:{...s.product,totalPremium:mockPremium(s)}}))},[state.product.coverAmount,state.product.coverType,state.family.spouse.length,state.family.child.length,state.family.extended.length,state.product.addOns.dataReward,state.product.addOns.funeral]);const next=()=>{let n=idx+1;if(state.product.coverType!=='family'&&steps[n]==='/funeral-cover/family-details')n++;if(state.payment.paymentMethod!=='debitOrder'&&steps[n]==='/funeral-cover/payment/debit-order')n++;nav(steps[Math.min(n,steps.length-1)])};const back=()=>nav(steps[Math.max(0,idx-1)]);return <div className="shell"><header><div className="brand">Voda<span>Sure</span></div><div className="preview">A/B variant · React preview</div></header><div className="progress">{labels.map((l,i)=><div key={l} className={i<=idx?'on':''}><b>{i+1}</b><small>{l}</small></div>)}</div><main>{renderPage(loc.pathname,state,setState,next,back)}</main></div>}
function Card({children}){return <section className="card">{children}</section>}
function Footer({back,next,nextText='Continue',hideBack=false}){return <div className="footer">{!hideBack&&<button className="secondary" onClick={back}>Back</button>}<button className="primary" onClick={next}>{nextText}</button></div>}
function Field({label,value,onChange,type='text'}){return <label>{label}<input type={type} value={value||''} onChange={e=>onChange(e.target.value)}/></label>}
function renderPage(path,s,setS,next,back){if(path.endsWith('/cover-details'))return <><h1>Choose your cover</h1><p className="lede">Simple funeral cover that fits your needs.</p><Card><h2>Who are you covering?</h2><div className="choice"><button className={s.product.coverType==='individual'?'selected':''} onClick={()=>setS(x=>({...x,product:{...x.product,coverType:'individual'}}))}>Just me</button><button className={s.product.coverType==='family'?'selected':''} onClick={()=>setS(x=>({...x,product:{...x.product,coverType:'family'}}))}>Me & my family</button></div><h2>How much cover do you need?</h2><div className="amounts">{[10000,20000,30000,40000,50000].map(a=><button key={a} className={s.product.coverAmount===a?'selected':''} onClick={()=>setS(x=>({...x,product:{...x.product,coverAmount:a}}))}>R{a/1000}k</button>)}</div><div className="estimate"><span>Estimated monthly premium</span><strong>{money(s.product.totalPremium)}</strong><small>Preview value only — production uses dynamic-quotes.</small></div></Card><Footer next={next} hideBack nextText="Get my quote"/></>;
if(path.endsWith('/quote'))return <><h1>Here’s your quote</h1><Card><div className="quote"><span>{money(s.product.coverAmount)} cover</span><strong>{money(s.product.totalPremium)}<small>/month</small></strong></div><div className="toggle"><input type="checkbox" checked={s.product.addOns.dataReward} onChange={e=>setS(x=>({...x,product:{...x.product,addOns:{...x.product.addOns,dataReward:e.target.checked}}}))}/><span>VodaPay Data Reward</span></div><div className="toggle"><input type="checkbox" checked={s.product.addOns.funeral} onChange={e=>setS(x=>({...x,product:{...x.product,addOns:{...x.product.addOns,funeral:e.target.checked}}}))}/><span>Funeral assistance</span></div></Card><Footer back={back} next={next} nextText="Accept quote"/></>;
if(path.endsWith('/personal-details'))return <><h1>Your details</h1><Card><div className="grid"><Field label="First name" value={s.personal.firstName} onChange={v=>setS(x=>({...x,personal:{...x.personal,firstName:v}}))}/><Field label="Surname" value={s.personal.surname} onChange={v=>setS(x=>({...x,personal:{...x.personal,surname:v}}))}/><Field label="Date of birth" type="date" value={s.personal.dateOfBirth} onChange={v=>setS(x=>({...x,personal:{...x.personal,dateOfBirth:v}}))}/><Field label="Cellphone number" value={s.personal.cellphoneNumber} onChange={v=>setS(x=>({...x,personal:{...x.personal,cellphoneNumber:v}}))}/><Field label="Email" value={s.personal.email} onChange={v=>setS(x=>({...x,personal:{...x.personal,email:v}}))}/><Field label="ID number" value={s.personal.idNumber} onChange={v=>setS(x=>({...x,personal:{...x.personal,idNumber:v}}))}/></div></Card><Footer back={back} next={next}/></>;
if(path.endsWith('/family-details'))return <><h1>Add family members</h1><Card><p>Add the people you want covered. This preview only tracks the member count.</p>{['spouse','child','extended'].map(k=><div className="member" key={k}><span>{k==='extended'?'Extended family':k[0].toUpperCase()+k.slice(1)}</span><button onClick={()=>setS(x=>({...x,family:{...x.family,[k]:[...x.family[k],{coverAmount:x.product.coverAmount}]}}))}>+ Add</button><b>{s.family[k].length}</b></div>)}</Card><Footer back={back} next={next}/></>;
if(path.endsWith('/beneficiary'))return <><h1>Beneficiary</h1><Card><div className="grid"><Field label="First name" value={s.beneficiary.firstName} onChange={v=>setS(x=>({...x,beneficiary:{...x.beneficiary,firstName:v}}))}/><Field label="Surname" value={s.beneficiary.surname} onChange={v=>setS(x=>({...x,beneficiary:{...x.beneficiary,surname:v}}))}/><Field label="Cellphone number" value={s.beneficiary.cellphoneNumber} onChange={v=>setS(x=>({...x,beneficiary:{...x.beneficiary,cellphoneNumber:v}}))}/></div></Card><Footer back={back} next={next}/></>;
if(path.endsWith('/payment')&&!path.includes('summary'))return <><h1>How would you like to pay?</h1><Card><div className="pay"><button className={s.payment.paymentMethod==='debitOrder'?'selected':''} onClick={()=>setS(x=>({...x,payment:{...x.payment,paymentMethod:'debitOrder'}}))}>Debit order</button><button className={s.payment.paymentMethod==='addToBill'?'selected':''} onClick={()=>setS(x=>({...x,payment:{...x.payment,paymentMethod:'addToBill'}}))}>Add to Vodacom bill</button></div></Card><Footer back={back} next={next}/></>;
if(path.endsWith('/debit-order'))return <><h1>Debit order details</h1><Card><div className="grid"><Field label="Bank" value={s.payment.bankName} onChange={v=>setS(x=>({...x,payment:{...x.payment,bankName:v}}))}/><Field label="Account holder" value={s.payment.accountHolderName} onChange={v=>setS(x=>({...x,payment:{...x.payment,accountHolderName:v}}))}/><Field label="Account number" value={s.payment.accountNumber} onChange={v=>setS(x=>({...x,payment:{...x.payment,accountNumber:v}}))}/></div></Card><Footer back={back} next={next}/></>;
if(path.endsWith('/payment-summary'))return <><h1>Payment summary</h1><Card><div className="summary"><p><span>Cover amount</span><b>{money(s.product.coverAmount)}</b></p><p><span>Monthly premium</span><b>{money(s.product.totalPremium)}</b></p><p><span>Payment</span><b>{s.payment.paymentMethod==='debitOrder'?'Debit order':'Add to bill'}</b></p></div><label className="terms"><input type="checkbox" checked={s.payment.agreeToTerms} onChange={e=>setS(x=>({...x,payment:{...x.payment,agreeToTerms:e.target.checked}}))}/> I agree to the terms and conditions.</label></Card><Footer back={back} next={s.payment.agreeToTerms?next:()=>{}} nextText="Buy now"/></>;
return <><div className="success">✓</div><h1>You’re covered</h1><p className="lede">Preview complete. No real policy was created.</p><Card><p>The production React variant will call the existing <code>funeralPolicyOrder()</code> service and only show this screen after a successful response.</p></Card></>}
createRoot(document.getElementById('root')).render(<BrowserRouter><Provider><App/></Provider></BrowserRouter>);</script></body></html>
