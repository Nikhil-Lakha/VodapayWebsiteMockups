<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>VodaSure Funeral Cover — React A/B Variant</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#202124;font-family:Arial,Helvetica,sans-serif}.shell{max-width:920px;margin:auto;min-height:100vh;background:white;box-shadow:0 0 30px #ddd}header{height:72px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}.brand{font-weight:800;font-size:28px;color:#e60000}.brand span{color:#222}.preview{font-size:12px;background:#f1f3f4;padding:7px 10px;border-radius:999px}.progress{display:flex;padding:22px 26px;gap:8px;overflow:auto;border-bottom:1px solid #eee}.progress div{display:flex;align-items:center;gap:5px;color:#aaa;min-width:max-content}.progress div:after{content:'—';margin-left:4px;color:#ddd}.progress div:last-child:after{display:none}.progress b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#eee;font-size:11px}.progress .on{color:#e60000}.progress .on b{background:#e60000;color:#fff}main{max-width:700px;margin:auto;padding:46px 24px 70px}h1{font-size:36px;margin:0 0 8px}h2{font-size:18px;margin:24px 0 12px}.lede{color:#666;margin:0 0 28px}.card{border:1px solid #e3e3e3;border-radius:16px;padding:24px;background:#fff}.choice,.amounts,.pay{display:flex;gap:10px;flex-wrap:wrap}.choice button,.amounts button,.pay button{background:#fff;border:1px solid #bbb;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer}.selected{border-color:#e60000!important;background:#fff5f5!important;color:#c80000}.estimate{margin-top:24px;background:#f8f8f8;padding:18px;border-radius:12px;display:grid;gap:5px}.estimate strong{font-size:30px}.estimate small{color:#777}.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.footer button{border-radius:999px;padding:13px 24px;font-weight:800;cursor:pointer}.primary{background:#e60000;color:#fff;border:1px solid #e60000}.secondary{background:#fff;color:#333;border:1px solid #aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{width:100%;border:1px solid #bbb;border-radius:9px;padding:13px;font-size:15px}.quote{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.quote strong{font-size:34px;color:#e60000}.quote small{font-size:13px;color:#666}.toggle,.member{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #eee}.toggle input,.terms input{width:auto}.member span{flex:1}.member button{border:0;background:#fff;color:#e60000;font-weight:800;cursor:pointer}.summary p{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.terms{display:flex;align-items:center;gap:10px;margin-top:20px}.success{width:72px;height:72px;border-radius:50%;background:#e9f8ec;color:#16833b;display:grid;place-items:center;font-size:40px;font-weight:800;margin-bottom:20px}@media(max-width:650px){header{padding:0 18px}.preview{display:none}.progress{padding:16px 18px}.progress small{display:none}.progress div:after{content:'·'}main{padding:32px 18px 60px}h1{font-size:29px}.grid{grid-template-columns:1fr}.choice button,.pay button{flex:1}.amounts button{flex:1 0 28%}.footer{position:sticky;bottom:0;background:white;padding:15px 0}.footer button{flex:1}}</style><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body><div id="root"></div><script type="text/babel">const {useEffect,useState}=React;const pages=['cover-details','quote','personal-details','family-details','beneficiary','payment','payment-summary','confirmation'];const labels=['Cover','Quote','Details','Family','Beneficiary','Payment','Summary','Done'];const initial={coverAmount:20000,coverType:'individual',firstName:'',surname:'',idNumber:'',family:0,payment:'debitOrder',terms:false};function premium(s){return ({10000:49,20000:79,30000:99,40000:119,50000:139}[s.coverAmount]||79)+(s.coverType==='family'?s.family*20:0)}function App(){const [i,setI]=useState(0);const [s,setS]=useState(()=>{try{return JSON.parse(sessionStorage.getItem('vodasure-react-preview'))||initial}catch(e){return initial}});useEffect(()=>sessionStorage.setItem('vodasure-react-preview',JSON.stringify(s)),[s]);useEffect(()=>{location.hash='/'+pages[i]},[i]);const next=()=>setI(Math.min(i+1,pages.length-1));const back=()=>setI(Math.max(i-1,0));const p=premium(s);return <div className="shell"><header><div className="brand">Voda<span>Sure</span></div><div className="preview">React A/B preview</div></header><div className="progress">{labels.map((l,n)=><div className={n<=i?'on':''} key={l}><b>{n+1}</b><small>{l}</small></div>)}</div><main>{i===0&&<><h1>Choose your cover</h1><p className="lede">Simple funeral cover that fits your needs.</p><div className="card"><h2>Who are you covering?</h2><div className="choice"><button className={s.coverType==='individual'?'selected':''} onClick={()=>setS({...s,coverType:'individual'})}>Just me</button><button className={s.coverType==='family'?'selected':''} onClick={()=>setS({...s,coverType:'family'})}>Me & my family</button></div><h2>How much cover do you need?</h2><div className="amounts">{[10000,20000,30000,40000,50000].map(a=><button key={a} className={s.coverAmount===a?'selected':''} onClick={()=>setS({...s,coverAmount:a})}>R{a/1000}k</button>)}</div><div className="estimate"><span>Estimated monthly premium</span><strong>R{p}</strong><small>Preview values only. Production will use dynamic-quotes.</small></div></div></>}{i===1&&<><h1>Here’s your quote</h1><div className="card"><div className="quote"><span>R{s.coverAmount.toLocaleString()} cover</span><strong>R{p}<small>/month</small></strong></div><div className="toggle"><input type="checkbox"/> <span>VodaPay Data Reward</span></div><div className="toggle"><input type="checkbox"/> <span>Funeral assistance</span></div></div></>}{i===2&&<><h1>Your details</h1><div className="card"><div className="grid"><label>First name<input value={s.firstName} onChange={e=>setS({...s,firstName:e.target.value})}/></label><label>Surname<input value={s.surname} onChange={e=>setS({...s,surname:e.target.value})}/></label><label>ID number<input value={s.idNumber} onChange={e=>setS({...s,idNumber:e.target.value})}/></label><label>Cellphone number<input/></label><label>Email<input type="email"/></label><label>Date of birth<input type="date"/></label></div></div></>}{i===3&&<><h1>Add family members</h1><div className="card"><div className="member"><span>Family members added</span><button onClick={()=>setS({...s,family:s.family+1})}>+ Add member</button><b>{s.family}</b></div></div></>}{i===4&&<><h1>Beneficiary</h1><div className="card"><div className="grid"><label>First name<input/></label><label>Surname<input/></label><label>Cellphone number<input/></label></div></div></>}{i===5&&<><h1>How would you like to pay?</h1><div className="card"><div className="pay"><button className={s.payment==='debitOrder'?'selected':''} onClick={()=>setS({...s,payment:'debitOrder'})}>Debit order</button><button className={s.payment==='addToBill'?'selected':''} onClick={()=>setS({...s,payment:'addToBill'})}>Add to Vodacom bill</button></div></div></>}{i===6&&<><h1>Payment summary</h1><div className="card summary"><p><span>Cover amount</span><b>R{s.coverAmount.toLocaleString()}</b></p><p><span>Monthly premium</span><b>R{p}</b></p><p><span>Payment</span><b>{s.payment==='debitOrder'?'Debit order':'Add to bill'}</b></p><label className="terms"><input type="checkbox" checked={s.terms} onChange={e=>setS({...s,terms:e.target.checked})}/>I agree to the terms and conditions.</label></div></>}{i===7&&<><div className="success">✓</div><h1>You’re covered</h1><p className="lede">Preview complete. No real policy was created.</p></>}<div className="footer">{i>0&&i<7&&<button className="secondary" onClick={back}>Back</button>}{i<7&&<button className="primary" onClick={next}>{i===0?'Get my quote':i===1?'Accept quote':i===6?'Buy now':'Continue'}</button>}</div></main></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
